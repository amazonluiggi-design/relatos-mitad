# Cada día programa en Facebook y YouTube lo que falte de todas las historias (respeta la cuota diaria de YouTube)
# y actualiza el panel. Lo ya programado se salta.
name: Programación diaria

on:
  schedule:
    # GitHub atrasa los cron varias horas: 3 intentos de madrugada (no repite lo ya hecho, y el límite de YouTube corta solo).
    - cron: "0 6,9,12 * * *" # 01:00, 04:00 y 07:00 en Ecuador
  workflow_dispatch:

concurrency:
  group: diario

jobs:
  programar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Credenciales (desde los secretos del repositorio)
        env:
          FB_PAGINA_JSON: ${{ secrets.FB_PAGINA_JSON }}
          FB_TXT: ${{ secrets.FB_TXT }}
          GOOGLE_TXT: ${{ secrets.GOOGLE_TXT }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p ~/.relatos-secretos
          printf '%s' "$FB_PAGINA_JSON" > ~/.relatos-secretos/facebook-pagina.json
          printf '%s' "$FB_TXT" > ~/.relatos-secretos/facebook.txt
          printf '%s' "$GOOGLE_TXT" > ~/.relatos-secretos/google.txt
          printf '%s' "$YOUTUBE_TOKEN_JSON" > ~/.relatos-secretos/youtube-token.json
          # Si el JSON de la página llegó roto, se regenera desde facebook.txt.
          node -e 'JSON.parse(require("fs").readFileSync(require("os").homedir()+"/.relatos-secretos/facebook-pagina.json","utf8"))' 2>/dev/null || node scripts/fb-token.mjs
      - name: Programar lo pendiente
        env:
          RELATOS_CLAVE: ${{ secrets.RELATOS_CLAVE }}
        run: |
          for f in publicaciones/*.mjs; do
            H=$(basename "$f" .mjs)
            [ -f "src/datos/$H-plan.json" ] || continue
            echo "== $H"
            node scripts/bajar-pendientes.mjs "$H"
            node scripts/fb-publicar.mjs "$H" 2>&1 | grep -vE "subido [0-9]+%" | tail -12 || true
            node autopilot/scripts/registrar-historia.mjs "$H" || true
          done
          # YouTube tiene límite diario de subidas: primero lo que sale en 3 días, luego en 7, luego el resto.
          for DIAS in 3 7 60; do
            for f in publicaciones/*.mjs; do
              H=$(basename "$f" .mjs)
              [ -f "src/datos/$H-plan.json" ] || continue
              echo "== YouTube $H (próximos $DIAS días)"
              YT_DIAS=$DIAS node scripts/yt-publicar.mjs "$H" 2>&1 | grep -E "subido|rror|Cuota|pasó|archivo" | tail -12 || true
              node autopilot/scripts/registrar-historia.mjs "$H" || true
            done
          done
          rm -rf out
      - name: Listas de reproducción de YouTube (necesita el token con permiso youtube.force-ssl)
        continue-on-error: true
        run: node scripts/yt-listas.mjs 2>&1 | tail -6
      - name: Guardar IDs publicados
        run: |
          git config user.name "Relatos de la Mitad"; git config user.email "amazonluiggi@gmail.com"
          git add publicaciones/*.json && git commit -m "Programación diaria $(date +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
