# Historia de Facebook (solo a mano). La diaria la hace el Worker relatos-autopilot a las 20:15 (el cron de GitHub se atrasaba horas).
name: Historia de Facebook

on:
  workflow_dispatch:

concurrency:
  group: historias-fb

jobs:
  historia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Interruptor de emergencia (DETENER EMPRESA)
        env:
          RELATOS_CLAVE: ${{ secrets.RELATOS_CLAVE }}
        run: node scripts/nube.mjs alto relatos publicaciones
      - name: Credenciales
        env:
          FB_PAGINA_JSON: ${{ secrets.FB_PAGINA_JSON }}
          FB_TXT: ${{ secrets.FB_TXT }}
        run: |
          mkdir -p ~/.relatos-secretos
          printf '%s' "$FB_PAGINA_JSON" > ~/.relatos-secretos/facebook-pagina.json
          printf '%s' "$FB_TXT" > ~/.relatos-secretos/facebook.txt
          node -e 'JSON.parse(require("fs").readFileSync(require("os").homedir()+"/.relatos-secretos/facebook-pagina.json","utf8"))' 2>/dev/null || node scripts/fb-token.mjs
      - name: Publicar la historia
        env:
          RELATOS_CLAVE: ${{ secrets.RELATOS_CLAVE }}
        run: node scripts/fb-historia.mjs
      - name: Guardar registro
        run: |
          git config user.name "Relatos de la Mitad"; git config user.email "amazonluiggi@gmail.com"
          git add publicaciones/fb-historias.json && git commit -m "Historia de Facebook $(date +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
